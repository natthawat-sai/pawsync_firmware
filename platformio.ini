[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
build_unflags = -std=gnu++11

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -Werror
build_src_filter = +<*>
